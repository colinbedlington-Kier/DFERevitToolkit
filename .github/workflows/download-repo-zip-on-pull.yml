name: Download Repo ZIP on Pull Request

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  build-repo-zip:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Create repository ZIP archive
        run: |
          ZIP_NAME="${{ github.event.repository.name }}-${{ github.event.pull_request.number }}-${{ github.sha }}.zip"
          zip -r "$ZIP_NAME" . -x ".git/*"
          echo "ZIP_NAME=$ZIP_NAME" >> "$GITHUB_ENV"

      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: repo-zip-${{ github.event.pull_request.number }}
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error
          retention-days: 14
